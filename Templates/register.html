{% extends "base.html" %}
{% block title %}Register | JSPM Events{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4">
            <a href="{{ url_for('index') }}" class="mb-3">← All events</a>

            <h1 class="h2">{{ event.title }}</h1>
            <p class="text-secondary">
                {{ event.event_date.strftime('%A, %d %B %Y at %I:%M %p') }}
                · {{ event.venue }}
            </p>

            <form method="post">
                <label class="form-label">Student ID</label>
                <input class="form-control mb-3" name="student_no" required>

                <label class="form-label">Full name</label>
                <input class="form-control mb-3" name="name" required>

                <label class="form-label">Email</label>
                <input class="form-control mb-3" type="email" name="email" required>

                <label class="form-label">Department</label>
                <input class="form-control mb-3" name="department" required>

                <button class="btn btn-primary w-100">Confirm registration</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
